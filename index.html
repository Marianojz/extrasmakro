<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sistema de gestión de horas extras y convocatorias — Celsur Op. Makro." />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Extras Celsur · Op. Makro</title>

    <!-- Google Fonts: Inter (opcional, carga solo si hay red) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          media="print" onload="this.media='all'" />

    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/supervisor.css" />
    <link rel="stylesheet" href="/src/v5.css" />
    <link rel="icon" href="/public/favicon.svg" type="image/svg+xml" />
    <script src="https://unpkg.com/lucide@latest" defer></script>
  </head>
  <body>

    <!-- Punto de montaje de la aplicación (app.js monta todo aquí) -->
    <main id="app"></main>

    <!-- Fallback cuando JS está desactivado -->
    <noscript>
      <div style="font-family:Arial,sans-serif;text-align:center;padding:60px 20px;color:#555">
        <h2>JavaScript requerido</h2>
        <p>Esta aplicación necesita JavaScript para funcionar. Habilitalo en tu navegador.</p>
      </div>
    </noscript>

    <!-- Captura errores críticos de módulos antes de que el app arranque -->
    <script>
      // FASE 1 — CAPTURA TOTAL DE ERRORES CON OVERLAY FULLSCREEN
      (function() {
        var errorOverlay = null;
        
        function createErrorOverlay() {
          if (errorOverlay) return errorOverlay;
          errorOverlay = document.createElement('div');
          errorOverlay.id = 'fatal-error-overlay';
          errorOverlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:#1a0505;color:#ff6b6b;z-index:999999;font-family:monospace;padding:20px;overflow:auto;display:flex;flex-direction:column;gap:10px;';
          errorOverlay.innerHTML = '<h1 style="margin:0;padding:10px;background:#dc2626;color:white;font-size:18px;">⚠️ ERROR CRÍTICO DETECTADO</h1><div id="error-details" style="flex:1;"></div>';
          document.body.appendChild(errorOverlay);
          return errorOverlay;
        }
        
        function showError(message, source, lineno, colno, stack) {
          var overlay = createErrorOverlay();
          var details = document.getElementById('error-details');
          if (!details) return;
          
          var errorInfo = document.createElement('div');
          errorInfo.style.cssText = 'background:#2a0a0a;border:1px solid #dc2626;padding:15px;margin-bottom:10px;';
          errorInfo.innerHTML = 
            '<div style="font-size:14px;font-weight:bold;margin-bottom:8px;">🔴 ' + escapeHtml(message) + '</div>' +
            '<div style="font-size:12px;color:#fca5a5;">📁 Archivo: ' + escapeHtml(source || 'unknown') + '</div>' +
            '<div style="font-size:12px;color:#fca5a5;">📍 Línea: ' + lineno + ' Columna: ' + colno + '</div>' +
            (stack ? '<pre style="font-size:11px;color:#fbbf24;white-space:pre-wrap;margin-top:8px;background:#1a0505;padding:10px;">' + escapeHtml(stack) + '</pre>' : '') +
            '<div style="font-size:10px;color:#999;margin-top:8px;">Timestamp: ' + new Date().toISOString() + '</div>';
          
          details.insertBefore(errorInfo, details.firstChild);
          console.error('[FATAL-ERROR]', message, source, lineno, stack);
        }
        
        function escapeHtml(str) {
          if (!str) return '';
          return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        
        window.onerror = function(message, source, lineno, colno, error) {
          console.error('[global-error]', message, source, lineno, colno);
          showError(message, source, lineno, colno, error && error.stack ? error.stack : '');
          return false;
        };
        
        window.onunhandledrejection = function(e) {
          var reason = e.reason;
          var message = reason && reason.message ? reason.message : String(reason);
          var stack = reason && reason.stack ? reason.stack : '';
          console.error('[unhandled-rejection]', reason);
          showError('Unhandled Promise Rejection: ' + message, '', 0, 0, stack);
          e.preventDefault();
        };
        
        console.log('[BOOT-TRACE] Global error listeners installed');
      })();
    </script>

    <!-- Firebase CDN: expone módulos globalmente antes de cargar la app -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import { getDatabase, ref, set, get, runTransaction, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
      import { getAuth, signInAnonymously, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

      window.firebaseModules = {
        initializeApp,
        getDatabase,
        ref,
        set,
        get,
        runTransaction,
        update,
        remove,
        getAuth,
        signInAnonymously,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged
      };
    </script>

    <!-- Supabase CDN: cliente JavaScript para PostgreSQL -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
      try {
        window.supabaseModules = {
          createClient: supabase.createClient
        };
      } catch(e) {
        console.warn('[supabase] CDN no disponible:', e.message);
        window.supabaseModules = { createClient: null };
      }
    </script>

    <!-- SheetJS: parseo de archivos XLS / XLSX -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <!-- Feature flags (lite) and build metadata (injected at release time) -->
    <script src="/public/feature-flags.js"></script>
    <script src="/public/build-metadata.js"></script>

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/strategic-integration.js"></script>
  </body>
</html>
